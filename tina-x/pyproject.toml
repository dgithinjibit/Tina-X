[project]
name = "tina-x"
version = "0.0.1"
description = "TINA-X — a symbolic cascading-failure reasoner (independent component of Project TINA-X)"
requires-python = ">=3.10"
dependencies = ["hyperon>=0.2.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tina_x"]

[tool.pytest.ini_options]
# Run pytest from the tina-x/ dir; the package is importable because it lives here.
testpaths = ["tests"]
