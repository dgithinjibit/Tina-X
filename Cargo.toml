# Project TINA-X — Rust workspace root
# Phase 0 scaffold. See ROADMAP.md.
[workspace]
resolver = "2"
members = [
    "rust-core",
    "rust-server",
    "rust-swarm",
    "zk-rust",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Project TINA-X contributors"]
repository = "https://github.com/web4ke/Project-TINA-X"

[workspace.dependencies]
# Shared deps pinned here so every crate agrees on versions.
anyhow = "1"
