[package]
name = "nzi-server"
version = "0.0.1"
description = "Project Nzi mission-control API: serves reflex telemetry + MeTTa decisions to the React dashboard"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nzi-core = { path = "../rust-core" }
nzi-swarm = { path = "../rust-swarm" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Live GEOGLOWS flood feed (G4D-RR bridge #6). OPTIONAL: gated behind the `live-feed` feature so
# the default build + tests stay network-free and dependency-light (the offline fixture is the
# default). Enable with `--features live-feed` to hit the real REST API. ureq is a tiny blocking
# HTTP client, which suits the synchronous geoglows module (no async needed there).
ureq = { version = "3", optional = true, features = ["json"] }

[features]
# Off by default. Turns on the real GEOGLOWS HTTP client path in `geoglows`.
live-feed = ["dep:ureq"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
